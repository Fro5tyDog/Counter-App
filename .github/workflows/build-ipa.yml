name: Build iOS app (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build web files
        run: npm run build

      - name: Create iOS project
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#e2611a' --splashBackgroundColor '#eef0f2'
          npx cap sync ios

      - name: Build app (no signing, Sideloadly signs it)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found $APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist && zip -qr BagTally.ipa Payload && ls -lh BagTally.ipa

      - name: Keep the IPA on the run page
        uses: actions/upload-artifact@v4
        with:
          name: BagTally-ipa
          path: dist/BagTally.ipa

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bag Tally build ${{ github.run_number }}
          files: dist/BagTally.ipa
          make_latest: true
